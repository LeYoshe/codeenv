name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: macos-arm64
            runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add '${{ matrix.target }}'
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}
      - name: Check formatting and project files
        run: |
          cargo fmt --check
          node --check web/app.js
          node --check tools/codemirror/entry.js
          python3 scripts/check-project.py
      - name: Check editor bundle and licenses
        working-directory: tools/codemirror
        run: |
          npm ci
          npm run check
      - name: Lint and test
        run: |
          cargo clippy --locked --all-targets --target '${{ matrix.target }}' -- -D warnings
          cargo test --locked --target '${{ matrix.target }}'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          version = tomllib.load(open('Cargo.toml', 'rb'))['package']['version']
          assert os.environ['RELEASE_TAG'] == f'v{version}', 'Tag must match Cargo.toml version'
          PY
      - name: Build and package
        run: |
          cargo build --locked --release --target '${{ matrix.target }}'
          target/${{ matrix.target }}/release/codeenv --version
          python3 scripts/package-release.py '${{ matrix.target }}'
      - name: Browser regression checks
        if: matrix.platform == 'linux-amd64'
        working-directory: tools/browser
        env:
          CODEENV_BINARY: ${{ github.workspace }}/target/${{ matrix.target }}/release/codeenv
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeenv-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14


  coverage:
    name: Rust coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Measure Rust tests
        run: |
          cargo llvm-cov --locked --html --output-dir coverage --ignore-filename-regex integration_tests.rs
          cargo llvm-cov report --json --summary-only --output-path coverage/summary.json --ignore-filename-regex integration_tests.rs
          python3 - <<'PYTHON'
          import json, os
          totals = json.load(open('coverage/summary.json'))['data'][0]['totals']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as report:
              report.write('### Rust test coverage\n\n')
              for metric in ['lines', 'functions', 'regions']:
                  data = totals[metric]
                  report.write(f"- {metric.title()}: {data['percent']:.2f}% ({data['covered']}/{data['count']})\n")
              report.write('\nRust tests only; browser scenarios and JavaScript are not included. Download the rust-coverage artifact for uncovered source lines.\n')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Prepare release
    needs: [build, coverage]
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'leyoshe/codeenv'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: codeenv-*
          merge-multiple: true
          path: dist
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" --json isDraft > release.json; then
            python3 -c 'import json; assert json.load(open("release.json"))["isDraft"], "Refusing to replace a published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes --title "codeenv $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
